name: React Doctor

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    name: React Doctor

    permissions:
      contents: read # Checkout the repository and diff against base
      pull-requests: write # Post / update sticky PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required to resolve the merge base for diff scope
          persist-credentials: false

      - name: React Doctor
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          blocking: error
          review-comments: false
          commit-status: false
