name: React Doctor

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    name: React Doctor

    permissions:
      contents: read # Checkout the repository and diff against base
      pull-requests: write # Post / update sticky PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Required to resolve the merge base for diff scope
          persist-credentials: false

      - name: React Doctor
        uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          blocking: error
          review-comments: false
          commit-status: false
