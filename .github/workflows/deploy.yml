name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read # Checkout the repository
      deployments: write # Publish Cloudflare Pages deployment

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js # zizmor: ignore[cache-poisoning] no cache: input set; nothing is restored or written
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Set Datadog build version
        run: |
          package_version=$(node -p "require('./package.json').version")
          echo "VITE_DD_VERSION=${package_version}+${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_DD_RUM_APPLICATION_ID: ${{ secrets.VITE_DD_RUM_APPLICATION_ID }}
          VITE_DD_RUM_CLIENT_TOKEN: ${{ secrets.VITE_DD_RUM_CLIENT_TOKEN }}
          VITE_DD_SITE: us5.datadoghq.com
          VITE_DD_SERVICE: telemetry-academy
          VITE_DD_ENV: production

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=telemetry-academy --branch=main
